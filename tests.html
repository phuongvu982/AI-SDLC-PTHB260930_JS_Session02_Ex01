<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kết Quả Kiểm Thử Mô-đun Giỏ Hàng - Rikkei Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.12);
      --success-border: rgba(16, 185, 129, 0.3);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --danger-border: rgba(239, 68, 68, 0.3);
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 40px 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .header-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .header-desc {
      color: var(--text-muted);
      font-size: 14px;
    }

    .summary-box {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 22px 26px;
      border-radius: 14px;
      margin-bottom: 30px;
      transition: all 0.2s ease;
    }

    .summary-box.pass {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
    }

    .summary-box.fail {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
    }

    .summary-badge {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--success);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .summary-box.fail .summary-badge {
      background: var(--danger);
    }

    .summary-number {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
    }

    .summary-sub {
      color: var(--text-muted);
      font-size: 14px;
    }

    .test-list-header {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
    }

    .test-results {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .test-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .test-item:hover {
      border-color: #475569;
      transform: translateY(-1px);
    }

    .test-item.test-pass {
      border-left: 4px solid var(--success);
    }

    .test-item.test-fail {
      border-left: 4px solid var(--danger);
    }

    .test-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .test-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.05em;
    }

    .test-pass .test-badge {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }

    .test-fail .test-badge {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    .test-title {
      font-size: 14px;
      color: #e2e8f0;
    }

    .test-title strong {
      color: #94a3b8;
      font-weight: 600;
    }

    .test-error {
      margin-top: 10px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-badge">Rikkei Shop • Session 02 • Ex 01</div>
      <h1>Kết Quả Kiểm Thử Tính Tiền Dòng Hàng</h1>
      <p class="header-desc">Kiểm thử tự động cho các hàm <code>calcLineTotal</code>, <code>calcVat</code>, <code>formatVnd</code>, <code>buildReceiptLine</code> trong <code>script.js</code></p>
    </header>

    <div id="test-summary" class="summary-box pass">
      <div class="summary-badge">✓</div>
      <div class="summary-text">
        <div class="summary-number">Đang chạy kiểm thử...</div>
        <div class="summary-sub">Vui lòng chờ trong giây lát</div>
      </div>
    </div>

    <div class="test-list-header">
      <span>Chi tiết danh sách test case</span>
      <span id="timestamp">11 Test Cases</span>
    </div>

    <div id="test-results" class="test-results"></div>
  </div>

  <!-- Nạp file logic và bộ kiểm thử -->
  <script src="script.js"></script>
  <script src="harness.js"></script>
  <script src="tests.js"></script>
</body>
</html>
